<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Snaplink</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 640px; margin: 10vh auto; padding: 0 1.5rem; }
  h1 { font-size: 1.5rem; margin-bottom: .25rem; }
  p.tag { color: #888; margin-top: 0; }
  form { display: flex; gap: .5rem; margin: 2rem 0 1rem; }
  input[type=url] { flex: 1; padding: .6rem .8rem; border: 1px solid #999; border-radius: 6px; font-size: 1rem; }
  button { padding: .6rem 1.2rem; border: none; border-radius: 6px; background: #2563eb; color: #fff; font-size: 1rem; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  #result { margin-top: 1rem; padding: .8rem 1rem; border-radius: 6px; background: rgba(37,99,235,.08); display: none; word-break: break-all; }
  #result a { font-weight: 600; }
  #error { color: #dc2626; margin-top: .5rem; display: none; }
  footer { margin-top: 3rem; color: #888; font-size: .85rem; }
  footer a { color: inherit; }
</style>
</head>
<body>
  <h1>Snaplink</h1>
  <p class="tag">A URL shortener engineered for high-throughput redirects: layered caching, atomic block-based ID allocation, and async click analytics.</p>

  <form id="shorten-form">
    <input type="url" id="url" placeholder="https://example.com/a/very/long/path" required />
    <button type="submit">Shorten</button>
  </form>
  <div id="result"></div>
  <div id="error"></div>

  <footer>
    <a href="https://github.com/sonofnos/snaplink" target="_blank" rel="noopener">Source on GitHub</a>
  </footer>

<script>
const form = document.getElementById('shorten-form');
const result = document.getElementById('result');
const error = document.getElementById('error');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const url = document.getElementById('url').value;
  const btn = form.querySelector('button');
  btn.disabled = true;
  result.style.display = 'none';
  error.style.display = 'none';
  try {
    const res = await fetch('/api/v1/links', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'request failed');
    result.innerHTML = `<a href="${data.short_url}" target="_blank">${data.short_url}</a>`;
    result.style.display = 'block';
  } catch (err) {
    error.textContent = err.message;
    error.style.display = 'block';
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
