services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: snaplink
      POSTGRES_PASSWORD: snaplink
      POSTGRES_DB: snaplink
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snaplink"]
      interval: 2s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      BASE_URL: "http://localhost:8080"
      DATABASE_URL: "postgres://snaplink:snaplink@postgres:5432/snaplink?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
