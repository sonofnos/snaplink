name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: go vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./...

      - name: Integration tests (Testcontainers)
        run: go test -tags integration ./... -timeout 5m

      - name: Docker build
        run: docker build -t snaplink:ci .
